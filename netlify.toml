# Netlify configuration to run Bun build in Barometro_WEB/frontend
[build]
  base = "Barometro_WEB/frontend"
  command = "bun install --frozen-lockfile && bun run build"
  publish = "dist/frontend/browser"
  # Cada despliegue a producción cuesta 15 créditos. Solo se construye si cambió la web
  # (o este archivo); las ramas de Dependabot nunca se construyen aquí.
  # Netlify omite la construcción cuando este comando termina con código 0.
  ignore = "case \"$HEAD\" in dependabot/*) exit 0;; esac; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../../netlify.toml"

# Only application routes should fall back to the Angular entry point.
# Missing JS/CSS chunks must return 404 instead of HTML with a 200 status.
[[redirects]]
  from = "/auth"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/auth/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/collect/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/perfil"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "24"
  BUN_VERSION = "1.3.14"
