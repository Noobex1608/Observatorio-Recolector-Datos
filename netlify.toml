# Netlify configuration to run Bun build in Barometro_WEB/frontend
[build]
  base = "Barometro_WEB/frontend"
  command = "bun install --frozen-lockfile && bun run build"
  publish = "dist/frontend/browser"

# SPA redirect rule for Angular Client-Side Routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Ensure Netlify uses the Angular runtime plugin (installed via Netlify UI)
[[plugins]]
  package = "@netlify/angular-runtime"


[build.environment]
  NODE_VERSION = "24"
  BUN_VERSION = "1.3.14"
