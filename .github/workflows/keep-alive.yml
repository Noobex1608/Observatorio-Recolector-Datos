name: Mantener backend encendido

# El plan gratuito de Render apaga el servicio tras ~15 minutos sin tráfico y el siguiente
# usuario espera el arranque en frío. Este ping cada 10 minutos lo mantiene despierto.
# Un solo servicio encendido todo el mes usa ~744 de las 750 horas gratuitas.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    name: Ping al backend
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Llamar a /up
        run: |
          curl --fail --silent --show-error --max-time 120 \
            --retry 3 --retry-delay 15 --retry-all-errors \
            -o /dev/null -w 'HTTP %{http_code} en %{time_total}s\n' \
            https://barometro-backend.onrender.com/up
