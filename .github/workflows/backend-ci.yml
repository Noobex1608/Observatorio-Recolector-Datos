name: Backend CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-test:
    name: PHP 8.4 Quality & Security Audit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: observatorio_testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret123password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql, bcmath, json, ctype, fileinfo, gd
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        working-directory: Barometro_WEB/backend
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer Dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('Barometro_WEB/backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Dependencies
        run: |
          cd Barometro_WEB/backend
          composer install --prefer-dist --no-progress --no-interaction

      - name: Security Audit (Composer Audit)
        run: |
          cd Barometro_WEB/backend
          composer audit

      - name: Code Style Verification (Laravel Pint)
        run: |
          cd Barometro_WEB/backend
          vendor/bin/pint --test

      - name: Execute Test Suite (PHPUnit)
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: observatorio_testing
          DB_USERNAME: postgres
          DB_PASSWORD: secret123password
        run: |
          cd Barometro_WEB/backend
          php artisan migrate:fresh --force
          vendor/bin/phpunit

  mobile-test:
    name: Mobile PWA build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Barometro_MOVIL/kobo-mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Barometro_MOVIL/kobo-mobile/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm test -- --watch=false

  web-test:
    name: Web build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Barometro_WEB/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high
      - run: bun run build
      - run: bun run test --watch=false
