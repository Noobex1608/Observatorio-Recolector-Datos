# Netlify configuration to run build in Barometro_MOVIL/kobo-mobile
[build]
  base = "Barometro_MOVIL/kobo-mobile"
  command = "npm ci && npm run build"
  publish = "dist/kobo-mobile/browser"
  # Cada despliegue a producción cuesta 15 créditos. Solo se construye si cambió la PWA;
  # las ramas de Dependabot nunca se construyen aquí.
  # Netlify omite la construcción cuando este comando termina con código 0.
  ignore = "case \"$HEAD\" in dependabot/*) exit 0;; esac; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

# SPA redirect rule for Angular Client-Side Routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[plugins]]
  package = "@netlify/angular-runtime"

[build.environment]
  NODE_VERSION = "24"
