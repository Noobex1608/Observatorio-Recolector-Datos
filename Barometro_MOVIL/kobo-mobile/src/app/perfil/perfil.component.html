<div class="perfil-container">
  <div class="form-header">
    <button class="btn-cancelar" (click)="regresar()">← {{ 'back' | translate }}</button>
    <h2>{{ 'settings' | translate }} — Perfil</h2>
  </div>

  @if (cargando) {
    <p style="text-align:center;padding:2rem;color:var(--text-secondary);">{{ 'loading' | translate }}</p>
  } @else {
    <div class="perfil-form">
      <div class="campo">
        <label for="perfil-nombre">Nombre *</label>
        <input id="perfil-nombre" type="text" [(ngModel)]="nombre" class="form-input" placeholder="Tu nombre" />
      </div>
      <div class="campo">
        <label for="perfil-email">Email</label>
        <input id="perfil-email" type="email" [value]="email" class="form-input disabled" disabled />
      </div>
      <div class="campo">
        <label for="perfil-telefono">Teléfono</label>
        <input id="perfil-telefono" type="tel" [(ngModel)]="telefono" class="form-input" placeholder="0999999999" />
      </div>
      <div class="campo">
        <label for="perfil-cargo">Cargo</label>
        <input id="perfil-cargo" type="text" [(ngModel)]="cargo" class="form-input" placeholder="Ej. Ingeniero" />
      </div>
      <div class="campo">
        <label for="perfil-bio">Bio</label>
        <textarea id="perfil-bio" [(ngModel)]="bio" class="form-input textarea" rows="3" placeholder="Acerca de ti..."></textarea>
      </div>
      <button class="btn-guardar" [disabled]="guardando || !nombre.trim()" (click)="guardar()">
        {{ guardando ? 'Guardando...' : ('save_draft' | translate) }}
      </button>
    </div>
  }
</div>
