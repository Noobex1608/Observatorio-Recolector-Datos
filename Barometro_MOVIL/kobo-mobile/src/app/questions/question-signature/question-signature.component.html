<div class="signature-container" [class.disabled]="disabled()">
  <div class="signature-header">
    <span class="signature-label">
      {{ question().label }}
      @if (question().required) {
        <span class="required-badge">*</span>
      }
    </span>
    @if (question().hint) {
      <p class="signature-hint">{{ question().hint }}</p>
    }
  </div>

  <div class="canvas-wrapper">
    <canvas
      #signatureCanvas
      class="signature-canvas"
      (mousedown)="startDrawing($event)"
      (mousemove)="draw($event)"
      (mouseup)="stopDrawing()"
      (mouseleave)="stopDrawing()"
      (touchstart)="startDrawing($event)"
      (touchmove)="draw($event)"
      (touchend)="stopDrawing()"
    ></canvas>
    
    @if (!isSigned()) {
      <div class="canvas-placeholder">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"/>
          <path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"/>
        </svg>
        <span>Firme aquí dentro del recuadro</span>
      </div>
    }
  </div>

  <div class="signature-actions">
    <button
      type="button"
      class="btn-clear"
      (click)="clear()"
      [disabled]="disabled() || !isSigned()"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 6h18"/>
        <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
        <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
      </svg>
      Limpiar
    </button>

    @if (isSigned()) {
      <span class="signed-status-badge">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        Firma Registrada
      </span>
    }
  </div>
</div>
