<div class="kobo-container">
  <div class="kobo-accent"></div>
  <header class="kobo-header">
    <div class="logo-area">
      <span class="logo-icon">📋</span>
      <h1>{{ 'app_title' | translate }} <small>PWA</small></h1>
    </div>
    <p class="subtitle">{{ 'app_subtitle' | translate }}</p>
  </header>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <footer class="kobo-footer">
    <p>{{ 'app_footer' | translate }}</p>
  </footer>
</div>

<div class="toast-container">
  @for (t of toast.toasts(); track t.id) {
    <div class="toast" [class]="'toast toast-' + t.type" (click)="toast.dismiss(t.id)">
      {{ t.message }}
    </div>
  }
</div>
