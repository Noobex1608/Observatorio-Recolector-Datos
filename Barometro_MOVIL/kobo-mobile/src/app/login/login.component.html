<div class="login-page">
  <section class="login-card" aria-labelledby="login-title">
    <div class="hero">
      <img src="/login-campus.png" alt="Campus de la Universidad Laica Eloy Alfaro de Manabí" />
    </div>

    <div class="brand-badge">
      <img src="/login-uleam.png" alt="ULEAM, Universidad Laica Eloy Alfaro de Manabí" />
    </div>

    <div class="card-body">
      <header class="intro">
        <p class="eyebrow">DATAFIELD · PWA</p>
        <h1 id="login-title">Bienvenido</h1>
        <p>Inicia sesión para continuar con tus encuestas.</p>
      </header>

      <form (ngSubmit)="iniciarSesion()" class="login-form">
        <div class="campo">
          <label for="usuario">CORREO ELECTRÓNICO</label>
          <input
            type="email"
            id="usuario"
            name="usuario"
            [(ngModel)]="usuario"
            placeholder="recolector@uleam.edu.ec"
            autocomplete="username"
            inputmode="email"
            required
            [disabled]="cargando" />
        </div>

        <div class="campo">
          <label for="clave">CONTRASEÑA</label>
          <input
            type="password"
            id="clave"
            name="clave"
            [(ngModel)]="clave"
            placeholder="Ingresa tu contraseña"
            autocomplete="current-password"
            required
            [disabled]="cargando" />
        </div>

        <div class="campo servidor-campo">
          <label for="urlServidor">SERVIDOR API</label>
          <input
            type="url"
            id="urlServidor"
            name="urlServidor"
            [(ngModel)]="urlServidor"
            placeholder="https://tu-servidor.com"
            inputmode="url"
            spellcheck="false"
            required
            [disabled]="cargando" />
        </div>

        @if (errorLogin) {
          <p class="error-msg" role="alert">{{ errorLogin }}</p>
        }

        <button type="submit" class="btn-acceder" [disabled]="cargando">
          {{ cargando ? 'VERIFICANDO...' : 'INICIAR SESIÓN' }}
        </button>
      </form>

      <p class="access-note">¿No tienes una cuenta? <span>Solicita acceso a tu administrador.</span></p>
    </div>
  </section>
</div>
