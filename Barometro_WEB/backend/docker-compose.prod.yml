version: '3.8'

services:
  # ============================================
  # Backend Laravel
  # ============================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: observatorio-backend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - APP_NAME=${APP_NAME:-Observatorio ULEAM}
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - LOG_CHANNEL=${LOG_CHANNEL:-stack}
      - LOG_LEVEL=${LOG_LEVEL:-error}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-observatorio_uleam}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - SANCTUM_STATEFUL_DOMAINS=${SANCTUM_STATEFUL_DOMAINS:-localhost,localhost:4200}
      - SESSION_DRIVER=cookie
      - CACHE_STORE=file
      - QUEUE_CONNECTION=sync
      - SEED_TOKEN=${SEED_TOKEN}
    volumes:
      - backend-storage:/var/www/html/storage/app/public
      - backend-logs:/var/www/html/storage/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - observatorio-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/documentation"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: observatorio-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_DATABASE:-observatorio_uleam}
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - observatorio-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-observatorio_uleam}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
    driver: local
  backend-storage:
    driver: local
  backend-logs:
    driver: local

networks:
  observatorio-network:
    driver: bridge
