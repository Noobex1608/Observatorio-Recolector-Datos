# Análisis local con SonarQube (ver scripts/sonar/escanear-sonar.ps1)
sonar.projectKey=barometro-uleam
sonar.projectName=Barómetro ULEAM
sonar.sourceEncoding=UTF-8

sonar.sources=Barometro_WEB/backend/app,Barometro_WEB/backend/routes,Barometro_WEB/backend/database,Barometro_WEB/backend/config,Barometro_WEB/frontend/src,Barometro_MOVIL/kobo-mobile/src
sonar.tests=Barometro_WEB/backend/tests,Barometro_WEB/frontend/src,Barometro_MOVIL/kobo-mobile/src
sonar.test.inclusions=**/*.spec.ts,Barometro_WEB/backend/tests/**/*.php
sonar.exclusions=**/node_modules/**,**/dist/**,**/vendor/**,**/storage/**,**/bootstrap/cache/**,**/.angular/**,**/.git/**,**/coverage/**,**/public/assets/gis/**,**/*.spec.ts,**/assets/**/*.json,**/*.geojson

sonar.typescript.tsconfigPaths=Barometro_WEB/frontend/tsconfig.app.json,Barometro_MOVIL/kobo-mobile/tsconfig.app.json
sonar.javascript.node.maxspace=4096
sonar.scm.disabled=true
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600

# El analizador JS/TS recorre todo el repositorio: se le indican las mismas exclusiones.
sonar.javascript.exclusions=**/node_modules/**,**/dist/**,**/vendor/**,**/storage/**,**/bootstrap/cache/**,**/.angular/**,**/.git/**,**/coverage/**,**/public/assets/gis/**,**/assets/**/*.json,**/*.geojson
sonar.css.exclusions=**/node_modules/**,**/dist/**,**/vendor/**,**/storage/**,**/public/**
sonar.javascript.lcov.reportPaths=scripts/sonar/reporte/lcov-web.info,scripts/sonar/reporte/lcov-pwa.info
sonar.php.coverage.reportPaths=scripts/sonar/reporte/clover.xml
