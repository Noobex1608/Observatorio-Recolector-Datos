; Ajustes de php-fpm para correr sin root dentro de udf/api.
[global]
pid = /tmp/php-fpm.pid
error_log = /proc/self/fd/2

[www]
listen = 127.0.0.1:9000
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

; Pool: la imagen base trae pm.max_children = 5, que se agota con pocas subidas lentas desde campo.
; Con el límite del contenedor (1 CPU, 1 GB) y ~40-60 MB por worker, 12 deja margen para
; exportaciones pesadas (memory_limit 256M). Si se cambian los recursos de la API, recalcular.
pm = dynamic
pm.max_children = 12
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; Recicla cada worker tras 500 peticiones para contener fugas de memoria.
pm.max_requests = 500
